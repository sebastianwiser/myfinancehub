[project]
name = "mainhub"
version = "0.1.0"
description = "Always-on personal finance platform: net worth, spending, itemized capture, read-only agents."
readme = "README.md"
authors = [{ email = "sebastian.wiser@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[project.scripts]
mainhub = "mainhub.cli.app:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "S", "T20", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
